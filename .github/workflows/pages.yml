name: Deploy site to GitHub Pages

# Publishes the Free Arabic Library as a static site.
#   /                 the app (index.html + assets/)
#   /standalone.html  the one-file offline build
#
# configure-pages enables Pages for the repository on the first run, so no
# manual switch in Settings is needed — the workflow's pages:write permission
# does it. GitHub Pages requires a public repository, or GitHub Pro/Team on a
# private one.

# Manual only. Pages cannot publish a private repo on a free account, so an
# automatic trigger just mails a failure on every push — Firebase Hosting
# (firebase-hosting.yml) is the live host. Make the repo public, or enable
# Pages by hand on Pro, and this becomes usable again from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build the site
        run: |
          node build.js --check
          node build.js
          cp dist/index.html dist/site/standalone.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
